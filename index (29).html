<script>
var currentUrl = "";
var currentFile = "";
var tempImgData = "";
var allOptions = Array.from(document.getElementById("memberSelect").options);

var imgEl = document.getElementById("hiddenCertImg");
if (imgEl.src.indexOf("data:image") === 0) {
  document.getElementById("adminBar").style.display = "none";
  tempImgData = imgEl.src;
}

document.getElementById("bgInput").onchange = function(e) {
  var f = e.target.files.item(0);
  if (!f) return;
  var r = new FileReader();
  r.onload = function(ev) {
    tempImgData = ev.target.result;
    document.getElementById("exportBtn").style.display = "inline-block";
    alert("원본 이미지 합체 완료! 이제 [배포용 단일 파일(index.html) 다운로드] 버튼을 누르세요.");
  };
  r.readAsDataURL(f);
};

document.getElementById("exportBtn").onclick = function() {
  if (!tempImgData) { alert("먼저 원본 이미지를 선택하세요."); return; }
  var rawHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  rawHtml = rawHtml.replace('src="PLACEHOLDER_CERT_DATA"', 'src="' + tempImgData + '"');
  var parts = new Array(rawHtml);
  var blob = new Blob(parts, { type: "text/html;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

document.getElementById("searchInput").onkeyup = function() {
  var kw = this.value.toLowerCase().trim();
  var sel = document.getElementById("memberSelect");
  sel.innerHTML = "";
  allOptions.forEach(function(opt) {
    if (!opt.value || opt.text.toLowerCase().indexOf(kw) !== -1) {
      sel.appendChild(opt.cloneNode(true));
    }
  });
};

function titleCase(s) {
  return s.toLowerCase().split(" ").map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(" ");
}

document.getElementById("memberSelect").onchange = function() {
  var val = this.value;
  if (!val) return;
  if (!tempImgData) { alert("먼저 상단에서 원본 증서 이미지를 선택하세요."); return; }

  var p = val.split("|");
  var nStr = titleCase(p.shift().trim());
  var cStr = titleCase(p.shift().trim());

  var img = new Image();
  img.onload = function() {
    var c = document.createElement("canvas");
    var w = img.width;
    var h = img.height;
    c.width = w;
    c.height = h;
    var ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);

    // 원본(image_yR2x2o.png) 좌측 하단 실제 한지 종이 톤(#f1e7cf ~ #ede1c7) 정밀 그라데이션 매칭
    var bx = w * 0.138, by = h * 0.742, bw = w * 0.264, bh = h * 0.088;
    var grad = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
    grad.addColorStop(0, "#f1e7cf");
    grad.addColorStop(0.5, "#efe4cc");
    grad.addColorStop(1, "#ede1c7");
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, bw, bh);

    var fs1 = Math.round(h * 0.040);
    ctx.font = "bold " + fs1 + "px Georgia, serif";
    while (ctx.measureText(nStr).width > bw * 0.88 && fs1 > 12) {
      fs1--;
      ctx.font = "bold " + fs1 + "px Georgia, serif";
    }

    var fs2 = Math.round(h * 0.025);
    ctx.font = "600 " + fs2 + "px Georgia, serif";
    while (ctx.measureText(cStr).width > bw * 0.88 && fs2 > 10) {
      fs2--;
      ctx.font = "600 " + fs2 + "px Georgia, serif";
    }

    var centerX = bx + bw / 2;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#22170e";
    ctx.font = "bold " + fs1 + "px Georgia, serif";
    ctx.fillText(nStr, centerX, by + bh * 0.35);
    ctx.font = "600 " + fs2 + "px Georgia, serif";
    ctx.fillText(cStr, centerX, by + bh * 0.77);

    currentUrl = c.toDataURL("image/png");
    currentFile = "NSMF_Transmitter_" + nStr.replace(/[^a-zA-Z0-9]/g, "_") + ".png";
    document.getElementById("previewArea").innerHTML = '<img src="' + currentUrl + '">';
    document.getElementById("downloadBtn").style.display = "inline-block";
  };
  img.src = tempImgData;
};

document.getElementById("downloadBtn").onclick = function() {
  var a = document.createElement("a");
  a.href = currentUrl;
  a.download = currentFile;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
</script>
